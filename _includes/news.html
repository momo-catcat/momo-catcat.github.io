
<div class="well" id="news-well">
<h4>News</h4>

{% for article in site.data.news limit:9 %}
<div class="news-item">
<p>{{ article.date }}<br>{{ article.headline | markdownify}}</p>
</div>
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>

    </div>

<script>
/* Show only as many whole news items as fit beside the left column
   (wide screens only). The rest are behind "... see all News". */
(function () {
  function fitNews() {
    var well = document.getElementById('news-well');
    var left = document.getElementById('homeid');
    if (!well || !left) return;
    var items = well.querySelectorAll('.news-item');
    var i;
    for (i = 0; i < items.length; i++) items[i].style.display = '';
    /* only trim when News really sits beside the left column
       (not on phones, and not if the stylesheet failed to load) */
    var newsCol = document.getElementById('newsid');
    if (!newsCol || newsCol.getBoundingClientRect().left <
        left.getBoundingClientRect().right - 1) return;

    /* bottom of the left column's visible content (the funding logos) */
    var target = 0, kids = left.querySelectorAll('img, p, h5, div');
    for (i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (r.height > 0 && r.bottom > target) target = r.bottom;
    }
    if (!target) return;

    var shown = items.length;
    while (shown > 1 && well.getBoundingClientRect().bottom > target) {
      items[--shown].style.display = 'none';
    }
  }
  var t;
  window.addEventListener('load', fitNews);
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fitNews, 100); });
  document.addEventListener('DOMContentLoaded', fitNews);
})();
</script>

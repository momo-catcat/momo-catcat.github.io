- name: Xu-Cheng He
  photo: Xu-ChengHE_2.jpg
  cv: CV_XCH.pdf
  info: Academy Research Fellow, PI
  description: "My research focuses on atmospheric aerosol formation and its climatic impacts, integrating advanced mass spectrometry, quantum chemistry, kinetic modelling, and Earth system modelling. My current work investigates chemical processes and particle formation mechanisms in the marine atmosphere, the upper troposphere above tropical rainforests, and the interactions between continental and marine environments."
  email: xucheng.he@helsinki.fi
  number_educ: 1
  education1: PhD at University of Helsinki, 2021.09
- name: Jiali Shen
  photo: Jiali.jpeg
  cv: CV_jiali.pdf
  info: University Researcher
  description: "My research focuses on atmospheric new particle formation and growth driven by dimethyl sulfide (DMS) and isoprene (IP), and their climatic impacts, using advanced mass spectrometry (APi-TOF, MION, Orbitrap) and kinetic modelling (box and 2-D models). My current work investigates the oxidation chemistry of DMS in the marine atmosphere and new particle formation from isoprene in the upper troposphere above tropical rainforests. Through controlled experiments at the CERN CLOUD chamber and collaborations within international research networks, I aim to advance our understanding of the chemical mechanisms driving aerosol formation and their implications for climate."
  email: jiali.shen@helsinki.fi
  number_educ: 1
  education1: PhD at University of Helsinki, 2023.04
- name: Dejia Yin
  photo: Dejia.jpeg
  cv: CV_dejia.pdf
  info: Postdoctoral Researcher
  description: "My research focuses on the formation of oxygenated organic molecules (OOMs), atmosphere new particle formation and their climate impact, mainly through kinetic modelling and 3-D chemical transport models (CMAQ, WRF-chem, etc.). My current work investigates the oxidation chemistry of isoprene and their impact on particle formation in the upper troposphere using the WRF-chem model. "
  email: dejia.yin@helsinki.fi
  number_educ: 1
  education1: PhD at Tsinghua University, 2025.10
- name: Julia David 
  photo: Julia.jpg
  cv: 
  info: Postdoctoral Researcher
  description: "My previous research focused on the chemical characterization of the aerosol-phase composition in urban, suburban, and rural environments using online Orbitrap mass spectrometry (Orbitrap-MS). I specialize in ambient measurements, focusing on how airports and agricultural practices influence local air quality. My current work investigates the aqueous-phase behaviour of secondary organic aerosol formed from isoprene once it is activated as a cloud droplet, through controlled experiments at the CERN CLOUD chamber."
  email: julia.d.david@helsinki.fi 
  number_educ: 1
  education1: PhD at Goethe University Frankfurt, 2026.05 
- name: Wenjuan Yu
  photo: Wenjuan.jpeg
  cv:
  info: Doctoral Student
  description: "My research focuses on atmospheric new particle formation and early particle growth in the marine atmosphere. I use particle instrumentation, including PSM, CPC, NAIS etc., together with thermodynamic modelling to investigate the mechanisms controlling particle formation and initial growth.Based on CLOUD chamber experiment at CERN, I study the role of sulfur-containing species such as sulfuric acid and methanesulfonic acid in driving particle formation under atmospherically relevant conditions. My work aims to improve the representation of marine aerosol-cloud interactions in climate models."
  email: wenjuan.yu@helsinki.fi
  number_educ: 1
  education1: MSc at University of Stockholm, 2022.06


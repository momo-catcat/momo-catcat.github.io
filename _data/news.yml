- date: 27. May 2025
  headline: "Xu-Cheng He gave a seminar at University of Reading about marine aerosols and climate projection uncertainties."

- date: 01. Jan 2025
  headline: "Xu-Cheng He moved back to University of Helsinki as a co-PI for the CLOUD project at CERN."

- date: 15. July 2024
  headline: "Xu-Cheng He received his rejection from ERC-StG interview and he will apply again this year."

- date: 16. June 2024
  headline: "Xu-Cheng He gave an invited seminar at Institute for Atmospheric and Earth System Research at University of Helsinki."

- date: 15. May 2024
  headline: "Xu-Cheng He gave an invited seminar at Max Planck Institute for Chemistry at Mainz."

- date: 22. Apr 2024
  headline: "Xu-Cheng He gave an invited seminar at the [SOLAS open seminar](https://www.solas-int.org/events/solas-seminar/solas-semianr-viii.html)"

- date: 05. May 2023
  headline: "Xu-Cheng He was invited to participate the Atmospheric Chemistry Colloquium for Emerging Senior Scientists (ACCESS XVII)."

- date: 12. Jan 2023
  headline: "Xu-Cheng He co-chairs the 'Measurement and modeling of atmospheric cloud condensation nuclei and related chemistry' session at AMS2023."

- date: 4. Jan 2023
  headline: "Xu-Cheng He starts visiting the Centre for Atmospheric Science, University of Cambridge. He will work on simulating atmospheric aerosol formation processes using the UKUM model with Luke Abraham and Alex Archibald."

- date: 10. Sep 2022
  headline: "Xu-Cheng He joins the CLOUD15 experiments. He is leading the experimental programs investigating marine particle formation processes."

- date: 06. Sep 2022
  headline: "Xu-Cheng He wins the Extraordinary Potential Prize of Chinese Government Award for Outstanding Self-financed Students Abroad as one of the 20 awardees globally."

- date: 05. Sep 2022
  headline: "Xu-Cheng He gives a talk titled 'Critical role of HIO2 in iodine oxoacid nucleation' at the International Aerosol Conference, Athens, 2022."

- date: 01. Sep 2022
  headline: "Xu-Cheng He joins Finnish Meteorological Institute as a post-doctoral researcher."

- date: 10. Aug 2022
  headline: "Xu-Cheng He gives an invited talk at the Gordon Research Conference for molecular and ionic clusters."

- date: 05. May 2022
  headline: "Xu-Cheng He wins the PhD dissertation award from University of Helsinki (4/500)."

- date: 01. Mar 2022
  headline: "Xu-Cheng He joins [Gordon Group](https://engineering.cmu.edu/accelerator/research/faculty/gordon-group.html) at Carnegie Mellon University for 6 months as a visiting researcher, including one-month's model training."


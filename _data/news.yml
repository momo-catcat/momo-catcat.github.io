- date: 17. Feb 2026
  headline: "We are excited to share that Wenjuan's first first-author paper is accepted in Environmental Science: Atmospheres. Congratulations, Wenjuan!"

- date: 15. Feb 2026
  headline: "Wenjuan has won a competitive travel grant from the University of Helsinki to attend the 2026 International Aerosol Conference in Xi'an, China. Congratulations, Wenjuan!"

- date: 10. Jan 2026
  headline: "We warmly welcome Dejia Yin joining the group as a postdoctoral researcher."

- date: Dec 2025 - Jan 2026
  headline: "Xu-Cheng gave a series of invited talks at Dalian University of Technology, Nanjing University and Research Center for Eco-Environmental Sciences, Chinese Academy of Sciences."

- date: 1. Sep 2025
  headline: "Xu-Cheng He's group currently has two postdoctoral positions under recruitment. Update Dec 1: both positions have now been filled, and no further applications are being accepted."

- date: 15. July 2025
  headline: "After being interviewed by the ERC panel in June, Xu-Cheng He received a rejection from the ERC-StG2025 call. 37% of the interviewees were funded but his ranking was 45%. What a pity :(. He will apply again in the next call in 2026. Wish him good luck!"

- date: 12. June 2025
  headline: "Xu-Cheng was awarded an Academy Research Fellowship by the Research Council of Finland and the University of Helsinki, securing €1.13 million in research funding."

- date: 27. May 2025
  headline: "Xu-Cheng He gave a seminar at University of Reading about marine aerosols and climate projection uncertainties."

- date: 01. Jan 2025
  headline: "Xu-Cheng He moved back to University of Helsinki as a co-PI for the CLOUD project at CERN."

- date: 15. July 2024
  headline: "Xu-Cheng He received his rejection from ERC-StG interview and he will apply again this year."

- date: 16. June 2024
  headline: "Xu-Cheng He gave an invited seminar at Institute for Atmospheric and Earth System Research at University of Helsinki."

- date: 15. May 2024
  headline: "Xu-Cheng He gave an invited seminar at Max Planck Institute for Chemistry at Mainz."

